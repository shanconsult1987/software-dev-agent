
name: Agentic Software Development

on:
  issues:
    types: [labeled]

  workflow_dispatch:
    inputs:
      requirement:
        description: Enter the software requirement
        required: true
        type: string

permissions:
  contents: read
  issues: read

concurrency:
  group: agent-${{ github.event.issue.number || github.ref }}
  cancel-in-progress: false

jobs:

  agent-workflow:

    name: Agent Orchestration and Unit Tests

    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.labels.*.name, 'agent-request')

    runs-on: ubuntu-latest

    steps:

      # STEP 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # STEP 2: Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # STEP 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # STEP 4: Execute four AI agents
      - name: Run Agent Orchestration
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
        run: |
          python -m agents.ci_entrypoint

      # STEP 5: Run unit tests
      - name: Run Unit Tests
        if: always()
        run: |
          python -m pytest -v

      # STEP 6: Upload agent report
      - name: Upload Agent Execution Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-execution-report
          path: data/ci_agent_report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Run evaluator
        run: python -m agents.evaluator
